name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  rls-integration:
    # Local Supabase stack (Postgres, PostgREST, Auth) in Docker on the runner. No secrets, no Claude call.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pip install -r requirements.txt pytest
      - run: supabase start
      - run: SUPABASE_INTEGRATION=1 pytest -m integration -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lead-inbox .
